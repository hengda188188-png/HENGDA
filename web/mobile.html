<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>上傳照片</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/overlay.css">
<link rel="stylesheet" href="/assets/css/mobile.css">
</head>
<body>
<div class="m-wrap">
  <header class="m-head">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h3l1.5-2h9L18 7h3v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <div style="min-width:0;flex:1">
      <div class="nm truncate" data-role="project-name"></div>
      <div class="small muted truncate" data-role="project-note"></div>
    </div>
    <a class="btn btn-sm" href="/" data-i18n="mobile.backToConsole"></a>
  </header>

  <section class="card m-card" data-role="device-card">
    <div class="panel-head" style="margin-bottom:6px">
      <h2 data-i18n="mobile.who"></h2>
      <span class="tag tag-uploaded mono" data-role="device-code"></span>
    </div>
    <p class="m-note" data-role="device-state"></p>
    <p class="m-note" style="margin-top:4px" data-i18n="mobile.deviceHint"></p>
    <p class="m-note" style="margin-top:4px" data-i18n="mobile.paste"></p>
  </section>

  <section class="card m-card">
    <div class="fld fld-lg">
      <label for="m-caption" data-i18n="mobile.captionLabel"></label>
      <input id="m-caption" type="text" maxlength="200" data-role="caption" data-i18n-placeholder="mobile.captionPlaceholder" autocomplete="off">
    </div>
    <div class="m-actions" style="margin-top:10px">
      <button type="button" class="btn btn-primary" data-act="pick">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5-9 9"/></svg>
        <span data-i18n="mobile.pick"></span>
      </button>
      <button type="button" class="btn" data-act="camera">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h3l1.5-2h9L18 7h3v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span data-i18n="mobile.camera"></span>
      </button>
    </div>
    <p class="m-note" style="margin-top:10px" data-role="remaining"></p>
    <input type="file" accept="image/*" multiple class="hidden" data-role="file-input" aria-hidden="true" tabindex="-1">
    <input type="file" accept="image/*" capture="environment" class="hidden" data-role="camera-input" aria-hidden="true" tabindex="-1">
  </section>

  <section class="card m-card">
    <div class="panel-head">
      <h2 data-i18n="app.name"></h2>
      <span class="small muted" data-role="uploaded-total"></span>
    </div>
    <div class="m-queue" data-role="queue"></div>
    <p class="m-empty small" data-role="queue-empty" data-i18n="mobile.queueEmpty"></p>
  </section>
</div>
<script type="module" src="/assets/js/mobile/main.js"></script>
</body>
</html>
