<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>掃碼傳圖工作台</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/overlay.css">
</head>
<body>
<main class="login-wrap">
  <section class="card panel login-card">
    <div class="brand" style="margin-bottom:14px">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM19 19h2v2h-2zM14 19h2v2h-2zM19 14h2v2h-2z"/></svg>
      <span data-i18n="app.name"></span>
    </div>
    <p class="small muted" style="margin-bottom:14px" data-i18n="login.hint"></p>
    <form data-role="form">
      <div class="fld fld-md" style="margin-bottom:12px">
        <label for="login-password" data-i18n="login.password"></label>
        <input id="login-password" type="password" data-role="password" autocomplete="current-password" data-autofocus="1">
      </div>
      <button type="submit" class="btn btn-primary" data-i18n="login.submit"></button>
      <p class="small" style="margin-top:10px;color:var(--danger)" data-role="error" role="alert"></p>
    </form>
    <p class="small muted" style="margin-top:16px" data-i18n="login.mobileNote"></p>
  </section>
</main>
<script type="module" src="/assets/js/login/main.js"></script>
</body>
</html>
