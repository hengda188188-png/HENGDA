name: Build and publish PhotoRelay

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content native/PhotoRelayNative.csproj)
          $version = $xml.Project.PropertyGroup.Version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match csproj v$version" }
      - name: Test
        shell: pwsh
        run: npm.cmd test
      - name: Build portable release
        shell: pwsh
        run: ./scripts/prepare-release.ps1
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/PhotoRelay-portable-win-x64.zip
            release/PhotoRelay-portable-win-x64.zip.sha256

